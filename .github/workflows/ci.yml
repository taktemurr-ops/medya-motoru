name: CI - analyze and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
  jvm:
    # Ekran kaydı ses/görüntü zamanlaması (saf Java, Android SDK gerekmez).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: JUnit - RecordClock / AudioTimeline
        run: |
          set -e
          M=https://repo1.maven.org/maven2
          curl -fsSLo /tmp/junit.jar $M/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSLo /tmp/hamcrest.jar $M/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          echo "8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3  /tmp/junit.jar" | sha256sum -c
          echo "66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9  /tmp/hamcrest.jar" | sha256sum -c
          CP=/tmp/junit.jar:/tmp/hamcrest.jar
          P=android/src/main/java/com/gamestudio100/medya_motoru
          T=android/src/test/java/com/gamestudio100/medya_motoru
          mkdir -p /tmp/jvm
          javac -Xlint:all -Werror -d /tmp/jvm -cp $CP $P/RecordClock.java $P/AudioTimeline.java $T/*.java
          java -cp /tmp/jvm:$CP org.junit.runner.JUnitCore \
            com.gamestudio100.medya_motoru.RecordClockTest \
            com.gamestudio100.medya_motoru.AudioTimelineTest
